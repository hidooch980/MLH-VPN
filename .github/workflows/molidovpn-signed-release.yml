name: MolidoVPN AI signed production release

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Type RELEASE to authorize publishing v1.2.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: molidovpn-production-release
  cancel-in-progress: false

jobs:
  build-sign:
    if: ${{ inputs.confirm_release == 'RELEASE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate release identity and signing secrets
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS_VALUE: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD_VALUE: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_B64" || { echo "Missing existing ANDROID_KEYSTORE_BASE64 secret"; exit 2; }
          test -n "$ANDROID_STORE_PASSWORD" || { echo "Missing existing ANDROID_KEYSTORE_PASSWORD secret"; exit 2; }
          test -n "$ANDROID_KEY_ALIAS_VALUE" || { echo "Missing existing ANDROID_KEY_ALIAS secret"; exit 2; }
          test -n "$ANDROID_KEY_PASSWORD_VALUE" || { echo "Missing existing ANDROID_KEY_PASSWORD secret"; exit 2; }
          if gh release view v1.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.2.0 already exists; refusing to overwrite a release"; exit 3
          fi
          python3 - <<'PY'
          import json
          m=json.load(open("apps/android/upstream.lock.json"))
          assert m["application_version"] == "1.2.0"
          assert m["application_version_code"] == 11
          PY
      - name: Test overlay and fetch pinned Android source
        run: |
          set -euo pipefail
          python3 -m unittest discover -s apps/android/tests -v
          mkdir -p work
          git clone --no-checkout https://github.com/2dust/v2rayNG.git work/android
          REVISION=$(python3 -c 'import json; print(json.load(open("apps/android/upstream.lock.json"))["commit"])')
          git -C work/android checkout --detach "$REVISION"
          git -C work/android submodule update --init --recursive
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools ndk;30.0.16248370'
          log-accepted-android-sdk-licenses: false
      - name: Build release APKs and run unit tests
        run: bash apps/android/build.sh "$PWD/work/android" release
      - name: Sign with the established MolidoVPN release identity
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/molidovpn-signing" dist
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/molidovpn-signing/release.keystore"
          unset ANDROID_KEYSTORE_B64
          tmp_password="$(openssl rand -hex 24)"
          keytool -importkeystore -noprompt \
            -srckeystore "$RUNNER_TEMP/molidovpn-signing/release.keystore" \
            -srcstorepass "$ANDROID_STORE_PASSWORD" -srcalias "$ANDROID_KEY_ALIAS_VALUE" \
            -srckeypass "$ANDROID_KEY_PASSWORD_VALUE" \
            -destkeystore "$RUNNER_TEMP/molidovpn-signing/release.p12" \
            -deststoretype PKCS12 -deststorepass "$tmp_password" -destkeypass "$tmp_password"
          unset ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS_VALUE ANDROID_KEY_PASSWORD_VALUE
          openssl pkcs12 -in "$RUNNER_TEMP/molidovpn-signing/release.p12" -passin "pass:$tmp_password" -nocerts -nodes -out "$RUNNER_TEMP/molidovpn-signing/key.pem"
          openssl pkcs12 -in "$RUNNER_TEMP/molidovpn-signing/release.p12" -passin "pass:$tmp_password" -clcerts -nokeys -out "$RUNNER_TEMP/molidovpn-signing/cert.pem"
          openssl pkcs8 -topk8 -nocrypt -in "$RUNNER_TEMP/molidovpn-signing/key.pem" -outform DER -out "$RUNNER_TEMP/molidovpn-signing/key.pk8"
          rm -f "$RUNNER_TEMP/molidovpn-signing/key.pem" "$RUNNER_TEMP/molidovpn-signing/release.keystore" "$RUNNER_TEMP/molidovpn-signing/release.p12"
          unset tmp_password
          expected='3C8849FC59084133E7B09402EE1665563F5329CE3602380A7E05FAEE8D4E7D7D'
          actual=$(openssl x509 -in "$RUNNER_TEMP/molidovpn-signing/cert.pem" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':')
          test "$actual" = "$expected" || { echo "Existing keystore does not match installed 1.1.0 identity"; exit 4; }
          sdk="$ANDROID_HOME/build-tools/37.0.0"
          for apk in work/android/V2rayNG/app/build/outputs/apk/fdroid/release/*.apk; do
            name=$(basename "$apk")
            "$sdk/zipalign" -c -P 16 4 "$apk"
            "$sdk/apksigner" sign --key "$RUNNER_TEMP/molidovpn-signing/key.pk8" --cert "$RUNNER_TEMP/molidovpn-signing/cert.pem" --v1-signing-enabled false --v4-signing-enabled false --out "dist/$name" "$apk"
            "$sdk/apksigner" verify --verbose --print-certs "dist/$name" > "$RUNNER_TEMP/molidovpn-signing/verify.txt"
            grep -Fqi "certificate SHA-256 digest: 3c8849fc59084133e7b09402ee1665563f5329ce3602380a7e05faee8d4e7d7d" "$RUNNER_TEMP/molidovpn-signing/verify.txt"
            "$sdk/aapt2" dump badging "dist/$name" > "$RUNNER_TEMP/molidovpn-signing/badging.txt"
            grep -F "package: name='io.github.hidooch980.mlhvpn.fdroid'" "$RUNNER_TEMP/molidovpn-signing/badging.txt"
            grep -F "versionName='1.2.0'" "$RUNNER_TEMP/molidovpn-signing/badging.txt"
            if grep -Fq 'application-debuggable' "$RUNNER_TEMP/molidovpn-signing/badging.txt"; then exit 5; fi
          done
          test "$(find dist -maxdepth 1 -name '*.apk' | wc -l)" -eq 3
          cp "$RUNNER_TEMP/molidovpn-signing/cert.pem" dist/MLHVPN-signing-cert.pem
          cp apps/android/INSTALL.fa.md apps/android/RELEASE-NOTES.fa.md dist/
          tar --exclude=.git --exclude=.gradle --exclude=build --exclude=libs --exclude=local.properties -czf dist/MLHVPN-android-source.tar.gz apps/android work/android
          (cd dist && sha256sum *.apk *.pem *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MolidoVPN-AI-signed-1.2.0
          path: dist/
          if-no-files-found: error
          retention-days: 30

  upgrade-smoke:
    needs: build-sign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: MolidoVPN-AI-signed-1.2.0
          path: release
      - name: Fetch previous stable APK and verify checksum
        run: |
          set -euo pipefail
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v1.1.0"
          curl -fL "$base/SHA256SUMS" -o previous.SHA256SUMS
          grep 'MLHVPN_1.1.0-fdroid_universal.apk$' previous.SHA256SUMS > previous.sha
          curl -fL "$base/MLHVPN_1.1.0-fdroid_universal.apk" -o previous.apk
          sha256sum -c previous.sha
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install previous.apk
            adb install -r release/MLHVPN_1.2.0-fdroid_universal.apk
            adb shell dumpsys package io.github.hidooch980.mlhvpn.fdroid | tee package.txt
            grep -F 'versionName=1.2.0' package.txt
            adb shell am start -W -n io.github.hidooch980.mlhvpn.fdroid/com.v2ray.ang.ui.main.MainActivity | tee launch.txt
            grep -F 'Status: ok' launch.txt
            sleep 3
            adb exec-out screencap -p > dashboard.png
            test -s dashboard.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: MolidoVPN-1.2.0-upgrade-smoke
          path: |
            package.txt
            launch.txt
            dashboard.png

  publish:
    needs: [build-sign, upgrade-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: MolidoVPN-AI-signed-1.2.0
          path: release
      - name: Verify checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS
          gh release create v1.2.0 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "MolidoVPN AI 1.2.0" --notes-file RELEASE-NOTES.fa.md ./*.apk ./*.pem ./*.tar.gz ./SHA256SUMS ./INSTALL.fa.md
