name: Signed Android release
on:
  push:
    branches: ['codex/android-standalone-v2ray']
    paths: ['apps/android/**', '.github/workflows/android-release.yml']
permissions:
  contents: read
concurrency:
  group: mlh-first-signed-release
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.event.head_commit.message == 'release: MLH VPN 0.4.0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Refuse replacement of an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 - "$RUNNER_TEMP/releases.json" <<'PY'
          import json, sys
          assert not any(x['tag_name'] == 'v0.4.0' for x in json.load(open(sys.argv[1]))), 'Release already exists; never rotate its signing key'
          assert json.load(open('apps/android/upstream.lock.json'))['application_version'] == '0.4.0'
          PY
      - name: Test overlay and fetch pinned upstream
        run: |
          python3 -m unittest discover -s apps/android/tests -v
          mkdir -p work
          git clone --no-checkout https://github.com/2dust/v2rayNG.git work/android
          REVISION=$(python3 -c 'import json; print(json.load(open("apps/android/upstream.lock.json"))["commit"])')
          git -C work/android checkout --detach "$REVISION"
          git -C work/android submodule update --init --recursive
          python3 apps/android/prepare.py work/android
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools ndk;30.0.16248370'
          log-accepted-android-sdk-licenses: false
      - name: Build release and regression tests
        run: bash apps/android/build.sh "$PWD/work/android" release
      - name: Sign initial release and encrypt recovery backup
        run: bash apps/android/sign-release.sh "$PWD/work/android"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: MLHVPN-encrypted-signing-backup
          path: backup/*.cms
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MLHVPN-signed-release
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MLHVPN-signed-test
          path: test-apk/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Signed-release-test-results
          path: work/android/V2rayNG/app/build/reports/tests/
          if-no-files-found: ignore
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: MLHVPN-signed-release
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: MLHVPN-signed-test
          path: test-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install release/MLHVPN_0.4.0-fdroid_x86_64.apk
            adb install test-apk/MLHVPN-androidTest.apk
            adb shell pm grant io.github.hidooch980.mlhvpn.fdroid android.permission.POST_NOTIFICATIONS
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am instrument -w io.github.hidooch980.mlhvpn.fdroid.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            grep -F 'OK (1 test)' instrumentation.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Signed-release-smoke-results
          path: instrumentation.txt
  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: MLHVPN-signed-release
          path: release
      - name: Publish verified signed APKs and corresponding source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum -c SHA256SUMS
          gh release create v0.4.0 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'MLH VPN 0.4.0' --notes-file RELEASE-NOTES.fa.md \
            ./*.apk ./*.signature.txt ./MLHVPN-signing-cert.pem ./MLHVPN-android-source.tar.gz ./SHA256SUMS ./INSTALL.fa.md
