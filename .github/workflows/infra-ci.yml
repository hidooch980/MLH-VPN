name: Infrastructure CI

on:
  push:
    branches: ["bootstrap/molla-vpn-foundation"]
    paths:
      - "infra/ansible/**"
      - ".github/workflows/infra-ci.yml"
  pull_request:
    paths:
      - "infra/ansible/**"
      - ".github/workflows/infra-ci.yml"

permissions:
  contents: read

jobs:
  ansible-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible Core
        run: python -m pip install "ansible-core==2.18.6"
      - name: Check playbook syntax
        working-directory: infra/ansible
        run: ansible-playbook -i inventory.example.ini playbooks/wireguard-server.yml --syntax-check
