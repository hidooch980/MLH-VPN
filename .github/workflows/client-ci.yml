name: Client CI

on:
  push:
    paths:
      - "apps/client/**"
      - ".github/workflows/client-ci.yml"
  pull_request:
    paths:
      - "apps/client/**"
      - ".github/workflows/client-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve dependencies
        working-directory: apps/client
        run: flutter pub get
      - name: Analyze
        working-directory: apps/client
        run: flutter analyze
      - name: Test
        working-directory: apps/client
        run: flutter test
