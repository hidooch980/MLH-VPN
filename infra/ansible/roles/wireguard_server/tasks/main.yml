---
- name: Require a detected uplink interface
  ansible.builtin.assert:
    that:
      - molla_vpn_uplink_interface is defined
      - molla_vpn_uplink_interface | length > 0
    fail_msg: "No uplink interface detected; set molla_vpn_uplink_interface explicitly."

- name: Install WireGuard and iptables
  ansible.builtin.apt:
    name:
      - wireguard
      - wireguard-tools
      - iptables
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure WireGuard configuration directory exists
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Check whether the server private key already exists
  ansible.builtin.stat:
    path: "{{ molla_vpn_private_key_path }}"
  register: molla_wg_key_stat

- name: Generate a server private key in memory
  ansible.builtin.command:
    argv:
      - wg
      - genkey
  register: molla_wg_generated_key
  changed_when: true
  no_log: true
  when: not molla_wg_key_stat.stat.exists

- name: Store the generated server private key with restrictive permissions
  ansible.builtin.copy:
    content: "{{ molla_wg_generated_key.stdout }}\n"
    dest: "{{ molla_vpn_private_key_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: not molla_wg_key_stat.stat.exists

- name: Read the server private key for local configuration rendering
  ansible.builtin.slurp:
    src: "{{ molla_vpn_private_key_path }}"
  register: molla_wg_private_key_file
  no_log: true

- name: Enable IPv4 forwarding
  ansible.builtin.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    sysctl_file: /etc/sysctl.d/90-molla-vpn.conf
    reload: true

- name: Render the WireGuard interface configuration
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: "{{ molla_vpn_config_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart WireGuard

- name: Enable and start the WireGuard interface
  ansible.builtin.systemd:
    name: "wg-quick@{{ molla_vpn_interface }}"
    enabled: true
    state: started
  when: molla_vpn_manage_service | bool
